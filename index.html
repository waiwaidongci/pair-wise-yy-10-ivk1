<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小型漆线雕工坊管理</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 68px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .board { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 320px; }
    .col.blocked-col { background: #f6f3fa; border-color: #c9c1df; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 82px; font-size: 12px; padding: 7px 8px; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(620px, calc(100vw - 24px)); padding: 0; }
    dialog.wide { width: min(760px, calc(100vw - 24px)); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; max-height: 82vh; overflow-y: auto; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    .ver { color: var(--violet); font-weight: 600; }
    .pending-banner { margin-top: 6px; padding: 7px 8px; border-radius: 6px; background: #efeaf8; color: #4d4375; font-size: 12px; line-height: 1.5; border: 1px dashed var(--violet); }
    .tag { display: inline-block; border-radius: 5px; padding: 1px 7px; font-size: 12px; margin: 1px 3px 1px 0; white-space: nowrap; }
    .tag.ver { background: #e8e4f5; color: #4d4375; }
    .tag.ok { background: #e2f0e6; color: #1f6b42; }
    .tag.warn { background: #f7ecd6; color: #8a601a; }
    .tag.change { background: #ece6f7; color: #4d4375; }
    .tag.log { background: #e6ecea; color: #5d6764; }
    .tag.archived { background: #ece9e2; color: #7a6f5d; }
    .confirm-box { margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: #fbfdfb; }
    .pending-box { padding: 9px; border: 1px dashed var(--violet); border-radius: 6px; background: #faf8fe; display: grid; gap: 4px; }
    #detailHistory { display: grid; gap: 8px; }
    .tl-row { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); }
    .tl-time { color: var(--muted); font-size: 12px; }
    .hint { font-size: 12px; color: var(--violet); }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); z-index: 10; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.ok { background: #1f6b42; color: #fff; }
    .toast.info { background: #56507a; color: #fff; }
    .toast.error { background: var(--red); color: #fff; }
    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .top, .lists, .toolbar { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
      .tl-row { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>小型漆线雕工坊管理</h1>
      <div class="sub">样稿确认与改样复确认 · 贴线、阴干、上金粉、待交付的作品流转与缺陷追踪</div>
    </div>
    <button id="exportBtn" class="secondary">导出 JSON</button>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增作品</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>贴线进度<input name="progress" type="number" min="0" max="100" value="25"></label>
        </div>
        <div class="grid2">
          <label>阴干日期<input id="newDryDate" name="dryDate" type="date" required></label>
          <label>交付日期<input id="newDelivery" name="delivery" type="date" required></label>
        </div>
        <div class="grid2">
          <label>金粉处理状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
          <label>当前状态<select name="status"><option>贴线中</option><option>待阴干</option><option>上金粉</option><option>待交付</option></select></label>
        </div>
        <label>样稿确认联系人<input name="contact" required placeholder="客户姓名 / 电话"></label>
        <label>初始缺陷（选填）<input name="initialDefect" placeholder="右下花瓣断线"></label>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">加入工坊并确认 v1 样稿</button>
      </form>

      <section class="panel">
        <h2>今日与风险</h2>
        <div class="lists">
          <div class="mini">
            <h3>今日待阴干</h3>
            <div id="todayDry"></div>
          </div>
          <div class="mini">
            <h3>缺陷作品</h3>
            <div id="defectList"></div>
          </div>
          <div class="mini">
            <h3>最近交付</h3>
            <div id="deliveryList"></div>
          </div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>交付排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干日期</option></select></label>
          <button id="clearFilters" type="button" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>
  </main>

  <dialog id="detailDialog" class="wide">
    <div class="dialog-body">
      <h2 id="detailTitle">作品详情</h2>
      <div id="detailContent" class="meta"></div>
      <div id="detailPending"></div>
      <label>追加缺陷（历史缺陷保留不覆盖）
        <input id="defectInput" placeholder="断线/翘线位置">
      </label>
      <div class="actions">
        <button id="saveDefect" type="button" class="warn">保存缺陷</button>
        <button id="closeDetail" type="button" class="secondary">关闭</button>
      </div>
      <h2 style="font-size:16px;margin:4px 0 0;">样稿与流转履历（旧版本只读留档）</h2>
      <div id="detailHistory"></div>
    </div>
  </dialog>

  <dialog id="changeDialog">
    <form id="changeForm" class="dialog-body" method="dialog">
      <h2>登记改样变更单</h2>
      <input type="hidden" name="workId">
      <div class="grid2">
        <label>联系人<input name="contact" required placeholder="客户姓名 / 电话"></label>
        <label>当前样稿版本<input name="version" required></label>
      </div>
      <div class="hint" id="versionHint"></div>
      <p class="meta" style="margin:0;">仅当纹样、胎体或线条发生变化时才需登记；确认后旧样稿失效，作品停在待复确认。</p>
      <div class="grid2">
        <label>改后胎体<input name="base" required></label>
        <label>改后纹样<input name="theme" required></label>
      </div>
      <label>改后线条<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
      <label>改样原因<textarea name="reason" required placeholder="客户改样的具体原因"></textarea></label>
      <div class="actions">
        <button type="submit" class="violet">登记变更单</button>
        <button id="cancelChange" type="button" class="secondary">取消</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="js/rules.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/page.js"></script>
</body>
</html>
